# GenericAgent 一键编排（单容器）
# 用法: docker compose up -d --build
# 详见 docs/docker_zh.md
services:
  ga:
    build: .
    image: genericagent:latest
    container_name: ga
    # 常驻 Web Hub 管理面板(8901); 8501 Streamlit 主界面默认关闭, 由面板一键开关
    command: wehub
    ports:
      - "8901:8901"     # Web Hub 管理面板 (常驻)
      - "8501:8501"     # Streamlit 主界面 (面板内启动 stapp 后可用, 默认关闭)
      - "8502:8502"     # stapp2 备用界面 (面板内启动后可用)
    environment:
      - GA_MODE=wehub
      # 鉴权口令: 在仓库目录创建 .env 文件写入 WEHUB_TOKEN=你的口令
      # (示例: echo "WEHUB_TOKEN=MySecret123" >> .env)  .env 已被 .gitignore 排除
      - WEHUB_TOKEN=${WEHUB_TOKEN:-}
      - GA_LANG=zh
    volumes:
      # 必填: API 密钥(从 mykey_template.py 复制为 ./mykey.py 并填写后挂载, 只读)
      - ./mykey.py:/app/mykey.py:ro
      # 数据: 项目目录 data/ 下本地持久化, 宿主机直接可取/删文件
      # git pull / build 只更新代码文件, 不触碰 data/ (已被 .gitignore/.dockerignore 排除)
      - ./data/memory:/app/memory
      - ./data/temp:/app/temp
    restart: unless-stopped
    # 其他模式(一次性): docker compose run --rm --no-deps ga tui / cli / agent ...

