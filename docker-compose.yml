# GenericAgent 一键编排
# 用法: docker compose up -d --build
# 详见 docs/docker_zh.md
services:
  genericagent:
    build: .
    image: genericagent:latest
    container_name: genericagent
    ports:
      - "8501:8501"
    environment:
      - GA_MODE=streamlit        # streamlit | tui | cli | agent
      - PORT=8501
      - GA_LANG=zh
    volumes:
      # 必填: API 密钥(从 mykey_template.py 复制为 ./mykey.py 并填写后挂载, 只读)
      - ./mykey.py:/app/mykey.py:ro
      # 可选: 持久化自进化记忆(首次启动自动从内置种子恢复 SOP)
      # - ./ga_memory:/app/memory
      # 可选: 持久化工作目录
      # - ./ga_temp:/app/temp
    restart: unless-stopped
    # TUI 交互模式(改用: docker compose run --rm genericagent tui):
    # stdin_open: true
    # tty: true
